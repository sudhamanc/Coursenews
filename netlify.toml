[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Friendly API paths -> Netlify Functions.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/threads"
  to = "/.netlify/functions/threads"
  status = 200

[[redirects]]
  from = "/api/threads/*"
  to = "/.netlify/functions/threads"
  status = 200

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/get-news"
  status = 200

# Security headers + CSP (Phase 6).
#
# Notes:
# - style-src allows 'unsafe-inline' because KaTeX emits inline style attributes
#   on rendered math; without it, equations break. Scripts are bundled by Astro
#   to same-origin files, so script-src does NOT need 'unsafe-inline'.
# - Login is disabled, so no third-party auth origins are allowed. The chat and
#   news calls are same-origin (/api/*).
# - External sources (arXiv, Hacker News) are fetched server-side in Functions,
#   so they need no browser CSP allowances.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"

# Long-cache immutable fingerprinted build assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
