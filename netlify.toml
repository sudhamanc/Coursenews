[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Astro 7 requires Node >= 22.12.0. (If a NODE_VERSION is also set in the
  # Netlify UI, it overrides this value — keep them in sync.)
  NODE_VERSION = "22"

# Friendly API paths -> Netlify Functions.
[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/threads"
  to = "/.netlify/functions/threads"
  status = 200

[[redirects]]
  from = "/api/threads/*"
  to = "/.netlify/functions/threads"
  status = 200

[[redirects]]
  from = "/api/news"
  to = "/.netlify/functions/get-news"
  status = 200

[[redirects]]
  from = "/api/ecosystem"
  to = "/.netlify/functions/get-ecosystem"
  status = 200

# On-demand "Latest in AI" refresh (secret-protected; see refresh-news.ts).
[[redirects]]
  from = "/api/refresh-news"
  to = "/.netlify/functions/refresh-news"
  status = 200

# Security headers + CSP (Phase 6).
#
# Notes:
# - style-src allows 'unsafe-inline' because KaTeX and Shiki emit inline style
#   attributes on rendered math and code; without it, equations/code break.
# - script-src allows 'unsafe-inline' because Astro inlines its small, self-
#   contained module scripts (the /latest news loader and the Dig-deeper chat
#   panel) directly into the HTML instead of emitting external files. All
#   dynamic content those scripts render is inserted via textContent, so there
#   is no HTML-injection sink for untrusted data.
# - Login is disabled, so no third-party auth origins are allowed. The chat and
#   news calls are same-origin (/api/*).
# - External sources (arXiv, Hacker News) are fetched server-side in Functions,
#   so they need no browser CSP allowances.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"

# Long-cache immutable fingerprinted build assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
