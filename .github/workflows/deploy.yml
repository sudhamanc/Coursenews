# Deploys to AWS on every push to main (scripts/deploy.sh: CDK, then the site).
#
# Authenticates with GitHub's OIDC token, so no AWS keys are stored here. The
# role is created by the stack itself, so the very first deploy is run from a
# laptop; then set the repository variable AWS_DEPLOY_ROLE_ARN (the stack's
# DeployRoleArn output). Until that variable exists, this workflow is skipped.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - run: bash scripts/deploy.sh
        env:
          BUDGET_EMAIL: ${{ vars.BUDGET_EMAIL }}
