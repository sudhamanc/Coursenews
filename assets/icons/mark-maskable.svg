<!--
  The Course Ledger — MASKABLE variant.

  Android crops maskable icons to a circle/squircle and guarantees only a
  centred circle of diameter 0.8 x size. At 512 that circle has r=204.8, so the
  largest square that always survives has half-side 204.8/sqrt(2) ~= 145 —
  i.e. every pixel of ink must sit inside x,y in [111, 401].

  mark.svg spans x 64..448 / y 106..428 (384 x 322) and would have its serifs
  and rule ends sliced off. Here the same artwork is scaled to 0.755 and
  re-centred so its bounding box lands exactly on [111, 401], and the light
  closing rule is dropped — at 6px x 0.755 it would alias into mush.

  scripts/make-icons.mjs asserts the rendered ink bbox against that window, so
  this geometry is checked on every regeneration rather than eyeballed.

  Same rasterisation rules as mark.svg: literal hex, paths not text.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="The Course Ledger">
  <rect width="512" height="512" fill="#fff1e5"/>

  <g transform="translate(62.7, 54.5) scale(0.755)">
    <rect x="64" y="106" width="384" height="16" fill="#33302e"/>
    <rect x="64" y="136" width="384" height="7" fill="#33302e"/>
    <path fill="#990f3d" d="
      M 150 196
      h 110 v 26 h -18
      v 160 h 108 v -18 h 26 v 64
      H 150 v -26 h 18
      V 222 h -18
      Z
    "/>
  </g>
</svg>
